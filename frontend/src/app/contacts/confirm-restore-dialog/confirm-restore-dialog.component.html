<h2 mat-dialog-title>Czy na pewno chcesz przywrócić kontakt?</h2>

<mat-dialog-content>
  <p>Kontakt "{{ data.contactName }}" wroci na liste kontaktow.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false">Anuluj</button>
  <button matButton type="button" class="restore-action" [mat-dialog-close]="true">
    Przywroc
  </button>
</mat-dialog-actions>
