<section class="contacts-page">
  <div class="contacts-panel">
    <header class="contacts-header">
      <div>
        <h1>Kontakty</h1>
      </div>

      <div class="table-actions" aria-label="Akcje listy">
        <button type="button" aria-label="Importuj">
          <mat-icon>upload</mat-icon>
        </button>
      </div>
    </header>

    <div class="contacts-table" role="table" aria-label="Kontakty">
      <div class="table-row table-head" role="row">
        <span role="columnheader">Imie i nazwisko</span>
        <span role="columnheader">E-mail</span>
        <span role="columnheader">Numer telefonu</span>
        <span role="columnheader">Stanowisko i firma</span>
      </div>

      <div class="empty-state">
        <mat-icon aria-hidden="true">person_add</mat-icon>
        <h2>Brak kontaktow</h2>
        <p>Dodaj pierwszy kontakt, aby pojawil sie na tej liscie.</p>
      </div>
    </div>
  </div>
</section>
