<main class="login-shell">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Logowanie</mat-card-title>
      <mat-card-subtitle>Wejdz do aplikacji przez konto Google</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <button
        matButton="filled"
        class="google-button"
        type="button"
        aria-label="Sign in with Google"
        [disabled]="isLoading()"
        (click)="signInWithGoogle()"
      >
        <span class="google-mark" aria-hidden="true">G</span>
        <span>{{ isLoading() ? 'Przekierowanie...' : 'Sign in with Google' }}</span>
      </button>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }
    </mat-card-content>
  </mat-card>
</main>
